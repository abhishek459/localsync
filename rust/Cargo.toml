[package]
name = "rust_lib_local_sync"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.100"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
flutter_rust_bridge = "=2.11.1"
hex = "0.4.3"
rand = "0.8.5"
sha2 = "0.10.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
